<title>Scene Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a timeline strip on top, then a horizontal rail of scene cards (film at the head, assets / text / notes below). */
:root{
  --bg:#e9e6e1;--card:#f8f7f4;--fg:#1d1b1a;--muted:#6b6560;--line:#d3cec7;
  --farm:#c4312a;--uv:#6d28ff;--coin:#e8891c;--ok:#2f8a4f;--warn:#b7791f;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141316;--card:#1d1c21;--fg:#ece9f2;--muted:#9a95a6;--line:#2f2d36;--farm:#ff5a4f;--uv:#9b72ff;--coin:#ffa53d;--ok:#4cc27a;--warn:#e0a640;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141316;--card:#1d1c21;--fg:#ece9f2;--muted:#9a95a6;--line:#2f2d36;--farm:#ff5a4f;--uv:#9b72ff;--coin:#ffa53d;--ok:#4cc27a;--warn:#e0a640;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);margin:0}
.wrap{padding-inline:clamp(16px,3vw,32px);padding-block:20px 32px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin-bottom:8px}
h1{font:800 18px/1.1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 small{display:inline;font:500 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-left:10px}
.counts{display:flex;flex-wrap:wrap;gap:6px;font:500 12px var(--mono)}
.full{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:3px 8px 3px 3px;border:1px solid var(--line);border-radius:6px;background:var(--card);max-width:100%}
.full:focus-visible{outline:2px solid var(--uv);outline-offset:2px}
.full .thumb{position:relative;width:88px;max-width:30vw;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000;flex:none}
.full .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.full .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.full .play span{width:22px;height:22px;font-size:10px!important;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff;font-size:15px;padding-left:3px}
.full .meta2{display:grid;gap:2px;font:500 11px/1.35 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.full .meta2 b{font:800 13px/1 var(--display);color:var(--fg);letter-spacing:.02em}
.full .meta2 i{display:none}
.refresh{all:unset;cursor:pointer;align-self:center;font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--card);white-space:nowrap}
.refresh:hover{color:var(--fg)}
.refresh:focus-visible{outline:2px solid var(--uv);outline-offset:2px}
.refresh[aria-disabled=true]{cursor:default;color:var(--uv)}
dialog.cinema{max-width:none;width:100vw;height:100dvh;margin:0;background:#000}
dialog.cinema::backdrop{background:#000}
dialog.cinema .stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
dialog.cinema video{flex:1;width:100%;min-height:0;max-height:none;object-fit:contain;background:#000;border-radius:0}
dialog.cinema .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;font:500 12px var(--mono);color:#bbb;letter-spacing:.06em;text-transform:uppercase}
dialog.cinema .bar button{font:600 12px var(--mono);background:#fff;color:#000;border:0;border-radius:4px;padding:5px 12px;cursor:pointer}
dialog.cinema .bar{transition:opacity .3s}
dialog.cinema.idle .bar{opacity:0}
.idle,.idle video,video.idle{cursor:none}
.timeline{display:flex;height:24px;border-radius:4px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;background:var(--card)}
.timeline button{all:unset;cursor:pointer;position:relative;border-right:1px solid var(--bg);display:flex;align-items:flex-end;padding:3px 4px;font:600 11px var(--mono);color:var(--fg);min-width:0;overflow:hidden}
.timeline button:last-child{border-right:0}
.timeline button:focus-visible{outline:2px solid var(--uv);outline-offset:-2px}
.timeline button .bar{position:absolute;left:0;right:0;top:0;height:6px}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px;align-items:flex-start}
.card{flex:0 0 min(600px,calc(100vw - 56px));scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0;height:max(480px,calc(100dvh - var(--railtop,40px) - 18px))}
.card .upper{flex:1 1 auto;min-height:120px;overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:auto;overscroll-behavior-y:contain;touch-action:auto}
.dock{flex:0 0 auto;position:relative;border-top:1px solid var(--line);padding:10px 16px 12px;background:var(--card)}
.newpill{position:absolute;left:50%;bottom:calc(100% + 10px);z-index:1;transform:translateX(-50%);font:600 12px var(--mono);background:var(--uv);color:#fff;border:0;border-radius:999px;padding:5px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.newpill[hidden]{display:none}
.waiting{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;background:var(--coin);color:#1d1b1a;font:600 12px var(--mono);letter-spacing:.04em;flex:0 0 auto}
.waiting[hidden]{display:none}
.waiting b{text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.waiting span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:500}
.waiting:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.working{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;background:var(--uv);color:#fff;font:600 12px var(--mono);letter-spacing:.04em;flex:0 0 auto}
.working[hidden]{display:none}
.working b{text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;display:flex;align-items:center;gap:6px}
.working span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:500}
.working .spin,.timeline .wdot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s ease-in-out infinite}
.timeline .wdot{position:absolute;left:4px;top:9px;background:var(--uv);box-shadow:0 0 0 2px var(--card)}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.working .spin,.timeline .wdot{animation:none}}
.inbox .item.run{border-left-color:var(--uv)}
.inbox h3{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 0}
.timeline button .k4{position:absolute;right:3px;bottom:3px;font:700 8px/10px var(--mono);letter-spacing:.02em;padding:0 2px;border-radius:2px;background:var(--uv);color:#fff}
.timeline button .dot{position:absolute;right:4px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--coin);box-shadow:0 0 0 2px var(--card)}
.card.inbox .upper{padding:16px}
.inbox h2{margin-bottom:4px}
.inbox .item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;width:100%;padding:10px 12px;margin-top:10px;border:1px solid var(--line);border-left:3px solid var(--coin);border-radius:4px;background:var(--bg)}
.inbox .item:focus-visible{outline:2px solid var(--uv);outline-offset:2px}
.inbox .item .who{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inbox .item .q{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.notemedia .nm-audio{grid-column:1/-1}.notemedia .nm-audio audio{width:100%}
.newpill:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.card video.main{display:block;width:100%;aspect-ratio:16/9;background:#000}
.clipwrap{position:relative;flex:0 0 auto;border-bottom:1px solid var(--line)}
.clipbadge{position:absolute;left:8px;top:8px;display:flex;gap:6px;align-items:center;font:600 11px var(--mono);color:#fff;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:3px;pointer-events:none;max-width:calc(100% - 16px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.clipbadge b{color:#c9b4ff}
.clipline{font:500 12px var(--mono);color:var(--muted)}
.clipline b{color:var(--fg)}
.picks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.picks .label{margin:0 4px 0 0}
.picks button{font:500 12px var(--mono);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.picks button[aria-pressed=true]{border-color:var(--fg)}
.body{padding:14px 16px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.body>*{min-width:0}
.note{overflow-wrap:anywhere}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--fg);font-weight:500}
h2{font:800 26px/1 var(--display);text-transform:uppercase;margin:2px 0 0;letter-spacing:.01em}
.pill{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:3px 10px;border:1px solid currentColor;background:transparent;color:var(--muted);appearance:none;cursor:pointer}
.pill:focus-visible{outline:2px solid var(--uv);outline-offset:2px}
.st-placeholder{color:var(--muted)} .st-animatic{color:var(--warn)} .st-footage{color:var(--coin)} .st-review{color:var(--uv)} .st-final{color:var(--ok)}
.bar.st-placeholder{background:var(--muted)} .bar.st-animatic{background:var(--warn)} .bar.st-footage{background:var(--coin)} .bar.st-review{background:var(--uv)} .bar.st-final{background:var(--ok)}
.label{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.lyrics{font-style:italic;margin:0;padding-left:10px;border-left:2px solid var(--farm)}
.lyrics p{margin:0}
.text p{margin:0;max-width:65ch}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.assets button{all:unset;cursor:pointer;position:relative;aspect-ratio:16/10;border-radius:3px;overflow:hidden;background:var(--bg);display:block}
.assets button:focus-visible{outline:2px solid var(--uv);outline-offset:1px}
.assets img,.assets video{width:100%;height:100%;object-fit:cover;display:block}
.assets .tag{position:absolute;left:4px;bottom:4px;font:600 9px var(--mono);background:rgba(0,0,0,.65);color:#fff;padding:1px 5px;border-radius:2px}
.notes{display:flex;flex-direction:column;gap:8px}
.note .who{display:flex;align-items:center;gap:8px}
.replybtn{margin-left:auto;font:600 11px var(--mono);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:1px 8px;cursor:pointer}
.replybtn:hover,.replybtn:focus-visible{color:var(--fg);border-color:var(--uv)}
.notemedia{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin:6px 0 2px}.notemedia figure{margin:0}.notemedia img,.notemedia video{display:block;width:100%;height:auto;border-radius:3px;background:#000}.notemedia .nm-img{all:unset;display:block;cursor:zoom-in;width:100%}.notemedia .nm-open{all:unset;cursor:pointer;font:500 11px var(--mono);color:var(--muted);margin-top:2px}.notemedia .cap{font-size:11px;color:var(--muted);margin-top:2px}
.quote{all:unset;box-sizing:border-box;cursor:pointer;display:block;margin:2px 0 6px;padding:4px 8px;border-left:2px solid var(--uv);font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--uv) 6%,transparent);border-radius:2px}
.replybar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px;padding:4px 8px;border-left:2px solid var(--uv);background:color-mix(in srgb,var(--uv) 8%,transparent);border-radius:2px}
.replybar[hidden]{display:none}
.replybar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.replybar button{all:unset;cursor:pointer;font-size:14px;color:var(--fg);padding:0 4px}
.note.flash{outline:2px solid var(--uv);outline-offset:2px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs button{flex:1;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 8px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--fg)}
.tabs button:focus-visible{outline:2px solid var(--uv);outline-offset:1px}
.card .assetsview{flex:1 1 auto;min-height:120px;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;padding:12px 16px}
.card .assetsview[hidden],.card .upper[hidden],.compose[hidden],#chatdock-global[hidden]{display:none}
.assetsview .assets{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.assetsview .assets button{aspect-ratio:16/9}
.assets button[hidden]{display:none}
.assets .doc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:10px 10px 22px;font:500 11px/1.35 var(--mono);color:var(--fg);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.assets .doc b{font:700 18px var(--mono);color:var(--uv)}
.assets .doc span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.afilter{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}
.afilter button{font:600 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
.afilter button[aria-pressed=true]{color:var(--fg);border-color:var(--fg)}
.afilter button:focus-visible{outline:2px solid var(--uv);outline-offset:1px}
dialog pre{margin:0;max-height:80vh;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12px/1.5 var(--mono);background:#111;color:#eee;padding:14px;border-radius:4px}
dialog audio{width:100%}
.assets .when{position:absolute;right:4px;top:4px;font:600 9px var(--mono);background:rgba(0,0,0,.65);color:#fff;padding:1px 5px;border-radius:2px}
.note{max-width:88%}
.note.me{align-self:flex-end;background:color-mix(in srgb,var(--uv) 14%,var(--card));border:1px solid color-mix(in srgb,var(--uv) 30%,var(--line))}
.note.claude{align-self:flex-start}
.typing{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:12px;background:var(--bg);border-left:2px solid var(--uv)}
.typing .dots{display:inline-flex;gap:3px}
.typing .dots i{width:5px;height:5px;border-radius:50%;background:var(--uv);opacity:.35;animation:blink 1.2s infinite}
.typing .dots i:nth-child(2){animation-delay:.2s}.typing .dots i:nth-child(3){animation-delay:.4s}
.typing.run .dots i{border-radius:1px}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing .dots i{animation:none;opacity:.7}}
.note{font-size:13px;padding:8px 10px;border-radius:4px;background:var(--bg)}
.note .who{font:500 11px var(--mono);color:var(--muted);margin-bottom:2px}
.note.claude{border-left:2px solid var(--uv)}
.compose{display:flex;gap:6px}
.attachrow{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0 0}
.att{position:relative;margin:0;width:64px;height:64px;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att.busy img{opacity:.45}.att.err{border-color:var(--farm)}
.attst{position:absolute;left:0;right:0;bottom:0;font:10px/1.3 var(--body);background:rgba(0,0,0,.6);color:#fff;text-align:center;padding:1px 2px}
.attx{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:18px;padding:0;cursor:pointer}
.attachbtn{flex:none;width:34px;min-height:38px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:18px;cursor:pointer}
.compose textarea.drop{outline:2px dashed var(--accent,currentColor);outline-offset:-3px}
.compose textarea{flex:1;min-width:0;resize:none;min-height:38px;max-height:120px;font:13px/1.4 var(--body);padding:8px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.compose button{font:600 12px var(--mono);border:0;border-radius:4px;padding:0 14px;background:var(--uv);color:#fff;cursor:pointer}
.compose button:disabled{opacity:.5;cursor:default}
.compose .btns{display:flex;flex-direction:column;gap:4px}
.compose button.plain{background:transparent;color:var(--fg);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted)}
dialog{border:0;padding:0;background:transparent;max-width:min(1100px,94vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.82)}
dialog .box{display:grid;gap:8px}
dialog img,dialog video{width:100%;max-height:80vh;object-fit:contain;background:#000;border-radius:4px}
dialog .cap{display:flex;justify-content:space-between;gap:10px;font:500 12px var(--mono);color:#ddd}
dialog .cap button{font:600 12px var(--mono);background:#fff;color:#000;border:0;border-radius:4px;padding:4px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.rail{scroll-behavior:auto}}
</style>
<div class="wrap">
<header>
  <h1><span id="boardtitle">Scene board</span><small id="boardsub">Loading…</small></h1>
  <button type="button" class="full" id="fullbtn" hidden aria-label="Watch the latest full cut"><span class="thumb"><video id="fullthumb" muted playsinline loop preload="metadata"></video><span class="play"><span aria-hidden="true">▶</span></span></span><span class="meta2"><b>Latest full cut</b><span id="fullmeta"></span><i>Click to watch in cinema mode</i></span></button>
  <button type="button" class="refresh" id="fullrefresh" title="Ask Claude to re-render the full film from the latest scene cuts" hidden>↻ Refresh</button>
  <div class="counts" id="counts"></div>
</header>
<nav class="timeline" id="timeline" aria-label="Scenes on the timeline"></nav>
<main class="rail" id="rail"></main>
</div>
<dialog id="cinema" class="cinema" aria-label="Full cut"><div class="stage"><video id="cinevid" controls playsinline></video><div class="bar"><span id="cinemeta"></span><button type="button" id="cineclose">Close (Esc)</button></div></div></dialog>
<dialog id="viewer"><div class="box"><div id="vmedia"></div><div class="cap"><span id="vname"></span><button id="vclose" type="button">Close</button></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
// everything the board shows lives in the artifact's db, so agents update one row and never republish the page:
//   board/meta  {title, subtitle, full:{src,hls,tag,when,ref}}   the header and the latest full cut
//   scenes/<id> {n,title,t0,t1,shots,see,state,lyrics[],status,video,clip:{tag,what,when,ref},picks[],assets[]}
//   status/<id> {status}  notes/*  {scene,by,text,at,ask?,media?}  activity/<id> {state,label,at}
let SCENES=[]; let FULL=null; let META={}; let scenesLoaded=false;
//   spend/*     {scene,provider,action,cents,at}  paid runs; the header totals them for people who can edit
let spendCents=0, spendRuns=0, canSeeSpend=false;
const STATUSES=[['placeholder','Placeholder'],['animatic','Animatic'],['footage','Footage'],['review','In review'],['final','Final']];
const status={}; const statusOverride={};
let notes=[]; let pending=[]; let activity={}; let notesLoaded=false; const chatState={}; let db=null, user=null, myId=null, comments=null, assets=null; const attach={};
const fmt=t=>{const m=Math.floor(t/60),s=(t%60);return m+':'+s.toFixed(1).padStart(4,'0')};
const el=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const c of kids)if(c!=null)e.append(c);return e};
const total=()=>SCENES.length?Math.max(...SCENES.map(s=>s.t1||0)):0;

const is4k=s=>/4K/.test((s.clip&&s.clip.tag)||'');
function renderTimeline(){
  const tl=document.getElementById('timeline');tl.replaceChildren();
  for(const s of SCENES){
    const b=el('button',{type:'button',title:`Scene ${s.n}: ${s.title}`,onclick:()=>document.getElementById('card-'+s.id).scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'})},el('span',{class:'bar st-'+status[s.id]}),String(s.n));
